# blueline.toml — bootstrap for cargo dogfood CI (PR3 feat/cargo-lock-ci)
# The current Cargo.lock crate set is onboarded without an approved baseline so
# `dogfood-cargo` can scan `Cargo.lock` on PRs touching it with `--fail-on high`.
# Findings stay visible (rendered as [INFO]/LOW in JSON) but no longer block;
# content heuristics (eval/network/script etc.) still apply in full and will
# still reach HIGH/BLOCK. To graduate a crate, approve its baseline via
# `blueline review <crate>@<version> --yes` and remove its entry here.
# See src/policy.rs:PackageAllowRule.allow_unreviewed_baseline

