name: 'Blueline CI Release Review'
description: 'Audits lockfile diffs against Git base refs for zero-days, lifecycle scripts, advisories, and provenance.'
author: 'Epoch AI Lab'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base-ref:
    description: 'Git base ref to diff against (e.g. origin/main). Defaults to the PR base branch, or origin/main outside PRs.'
    required: false
    default: ''
  lockfile-path:
    description: 'Path to package-lock.json'
    required: false
    default: 'package-lock.json'
  fail-on:
    description: 'Minimum verdict risk band that fails the action (low, medium, high, block)'
    required: false
    default: 'high'
  policy-path:
    description: 'Optional path to blueline.toml policy file'
    required: false
    default: ''
  output-file:
    description: 'Optional path to save the JSON report'
    required: false
    default: ''
  version:
    description: 'Blueline release to download (e.g. v0.3.1) or "latest". Ignored when build-from-source is true.'
    required: false
    default: 'latest'
  build-from-source:
    description: 'Build blueline from the checked-out source with cargo instead of downloading the prebuilt release binary. Required when scanning with unreleased code (e.g. this repo''s own dogfood job).'
    required: false
    default: 'false'
  verify-attestation:
    description: 'Verify the downloaded release binary''s GitHub build-provenance attestation before running it. Turn this off only for a release published before attestations existed; the SHA256SUMS check alone cannot distinguish a good release from a tampered one, because both come from the same release.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve Blueline binary
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
        # Wired explicitly. Actions does not expose a token as an env var on its
        # own, so the authenticated branch below was dead code and every
        # consumer took the unauthenticated path -- api.github.com rate-limits
        # by IP, and runner IPs are shared.
        GITHUB_TOKEN: ${{ github.token }}
        # Inputs reach the shell through env, never through ${{ }} in a run
        # body: a value interpolated into a script is a value the shell parses.
        INPUT_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
      run: |
        set -euo pipefail
        OUT_DIR="${RUNNER_TEMP}/blueline-bin"
        mkdir -p "$OUT_DIR"
        if [ "$INPUT_BUILD_FROM_SOURCE" = "true" ]; then
          cargo build --locked --release
          printf '%s' "$PWD/target/release/blueline" > "$OUT_DIR/path"
          exit 0
        fi

        OS="$(uname -s)"
        ARCH="$(uname -m)"
        case "$OS-$ARCH" in
          Linux-x86_64) TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-arm64) TARGET="aarch64-apple-darwin" ;;
          Darwin-x86_64) TARGET="x86_64-apple-darwin" ;;
          MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64|Windows_NT-x86_64) TARGET="x86_64-pc-windows-msvc" ;;
          MINGW*-aarch64|MSYS*-aarch64|CYGWIN*-aarch64|Windows_NT-aarch64) TARGET="aarch64-pc-windows-msvc" ;;
          *) echo "::error::unsupported runner platform $OS-$ARCH" && exit 1 ;;
        esac

        REPO="Epoch-AI-Lab/blueline"
        TAG="$INPUT_VERSION"
        if [ "$TAG" = "latest" ]; then
          TMP_JSON="$(mktemp)"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -o "$TMP_JSON" "https://api.github.com/repos/$REPO/releases/latest"
          else
            curl -fsSL -o "$TMP_JSON" "https://api.github.com/repos/$REPO/releases/latest"
          fi
          TAG="$(grep -m1 '"tag_name"' "$TMP_JSON" | cut -d'"' -f4)"
          rm -f "$TMP_JSON"
          [ -n "$TAG" ] || { echo "::error::could not resolve latest blueline release" && exit 1; }
        fi
        VER="${TAG#v}"
        ASSET="blueline-$VER-binary-$TARGET"
        case "$TARGET" in *windows*) ASSET="$ASSET.exe" ;; esac

        cd "$OUT_DIR"
        curl -fsSL -o "$ASSET" "https://github.com/$REPO/releases/download/$TAG/$ASSET"
        curl -fsSL -o SHA256SUMS "https://github.com/$REPO/releases/download/$TAG/SHA256SUMS"
        EXPECTED="$(grep -F " $ASSET" SHA256SUMS || true)"
        [ -n "$EXPECTED" ] || { echo "::error::release SHA256SUMS has no entry for $ASSET" && exit 1; }
        printf '%s\n' "$EXPECTED" | sha256sum -c -

        # SHA256SUMS and the binary are published by the same release, so
        # `sha256sum -c` proves the download was not corrupted in transit and
        # nothing more: a compromised release job signs its own checksums.
        # release.yml already publishes a Sigstore build-provenance attestation
        # for every binary (actions/attest-build-provenance), so verify that
        # before executing. This is the same trust boundary the tool itself
        # refuses to cross as P03_SIGNATURE_REQUIRED_MISSING.
        if [ "$INPUT_VERIFY_ATTESTATION" = "true" ]; then
          if ! gh attestation verify "$ASSET" --repo "$REPO"; then
            echo "::error::no valid build provenance for $ASSET from $TAG; refusing to run it"
            exit 1
          fi
        else
          echo "::warning::attestation verification disabled by input; $ASSET is authenticated only by a checksum published beside it"
        fi

        chmod +x "$ASSET"
        printf '%s' "$OUT_DIR/$ASSET" > "$OUT_DIR/path"

    - name: Run Blueline CI Scan
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_LOCKFILE_PATH: ${{ inputs.lockfile-path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        set -euo pipefail
        BLUELINE="$(cat "${RUNNER_TEMP}/blueline-bin/path")"
        [ -x "$BLUELINE" ] || { echo "::error::blueline binary missing at $BLUELINE" && exit 1; }
        BASE="${INPUT_BASE_REF:-${GITHUB_BASE_REF:-origin/main}}"
        if ! git rev-parse --verify --quiet "$BASE" >/dev/null 2>&1; then
          BASE="origin/$BASE"
        fi
        ARGS=(ci --base "$BASE" --lockfile "$INPUT_LOCKFILE_PATH" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_POLICY_PATH" ]; then
          ARGS+=(--policy "$INPUT_POLICY_PATH")
        fi
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          ARGS+=(--format json --output-file "$INPUT_OUTPUT_FILE")
        fi

        echo "Executing: blueline ${ARGS[*]}"
        "$BLUELINE" "${ARGS[@]}"
