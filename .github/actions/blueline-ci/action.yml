name: 'Blueline CI Release Review'
description: 'Audits lockfile diffs against Git base refs for zero-days, lifecycle scripts, advisories, and provenance.'
author: 'Epoch AI Lab'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base-ref:
    description: 'Git base ref to diff against (e.g. origin/main or ${{ github.base_ref }})'
    required: false
    default: 'origin/main'
  lockfile-path:
    description: 'Path to package-lock.json'
    required: false
    default: 'package-lock.json'
  fail-on:
    description: 'Minimum verdict risk band that fails the action (low, medium, high, block)'
    required: false
    default: 'high'
  policy-path:
    description: 'Optional path to blueline.toml policy file'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run Blueline CI Scan
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_LOCKFILE_PATH: ${{ inputs.lockfile-path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
      run: |
        ARGS=(ci --base "$INPUT_BASE_REF" --lockfile "$INPUT_LOCKFILE_PATH" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_POLICY_PATH" ]; then
          ARGS+=(--policy "$INPUT_POLICY_PATH")
        fi

        echo "Executing: blueline ${ARGS[*]}"
        cargo run --locked --release -- "${ARGS[@]}"
