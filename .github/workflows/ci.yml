name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  # Dogfood: our own composite Action reviews our own npm distribution
  # lockfile on every PR. Any dependency added to the shipped packages gets
  # the same review customers get.
  dogfood:
    name: Dogfood (blueline on own npm dist)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swatinem/rust-cache@v2
      - uses: ./.github/actions/blueline-ci
        id: scan
        continue-on-error: true
        with:
          # First-party packages legitimately ship binaries and process-exec
          # primitives with no registry baseline, so fail-closed scanning
          # reports BLOCK on ourselves and CI runners keep no approval store.
          # Risk findings stay visible in the step summary; the hard gate is
          # scanner health below.
          fail-on: block
          output-file: blueline-dogfood.json
      - name: Gate on scanner health, report risk separately
        run: |
          python3 - <<'EOF'
          import json, sys

          r = json.load(open("blueline-dogfood.json"))
          names = {i["name"] for i in r["items"]}
          expected = {"@bluelinecli/cli", "blueline", "@bluelinecli/binary-linux-x64-gnu"}

          if r["total_evaluated"] == 0:
              assert r["unchanged_count"] > 0, "no delta and nothing unchanged — scan saw nothing"
          else:
              missing = expected - names
              assert not missing, f"scanner failed to evaluate: {missing}"

          print(f"dogfood scanner healthy: evaluated {r['total_evaluated']}, "
                f"unchanged {r['unchanged_count']}, max band {r['max_band']}")
          for item in r["items"]:
              print(f"  {item['name']}@{item['new_version']}: {item['verdict']['band']}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blueline-dogfood-report
          path: blueline-dogfood.json

  dogfood-cargo:
    name: Dogfood (blueline on own Cargo.lock)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && hashFiles('Cargo.lock') != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swatinem/rust-cache@v2
      - name: Check Cargo.lock changed vs base
        id: changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null 2>&1; then
            BASE="${{ github.base_ref }}"
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qx "Cargo.lock"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock unchanged vs $BASE — skipping cargo dogfood"
          fi
      - name: Run blueline on Cargo.lock (cargo)
        if: steps.changed.outputs.changed == 'true'
        run: cargo run --locked -- --ecosystem cargo ci --lockfile Cargo.lock --fail-on high --base origin/${{ github.base_ref }}

  # Mutation testing guards the trust boundary: it proves the test suite would
  # catch a regression like the poisoned-baseline bug, so audits don't have to.
  # Warnings must NOT be denied here — a mutation IS the divergence, and
  # `-D warnings` would mask the signal (surviving mutants would look caught).
  mutants-pr:
    name: Mutation testing (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Diff against PR base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}" -- > pr.diff
      - name: Mutate the changed lines
        run: cargo mutants --in-diff pr.diff --file src/extract.rs --file src/manifest.rs --file src/registry/npm.rs --file src/store.rs --file src/executor.rs --file src/lockfile.rs --file src/ci.rs --file src/mcp.rs --in-place --no-shuffle --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-pr.out
          path: mutants.out

  # Sharded across 4 parallel runners instead of one. A single runner serializes
  # every mutant (~233 on a full run = ~14 min); `--jobs 4` on one runner does
  # NOT help because the worker copies cold-build simultaneously and thrash the
  # shared cores, and the incremental cache is keyed on absolute source paths so
  # copies recompile the whole crate per mutant. Separate runners each get their
  # own warm in-place cache, so shards run at full single-thread speed (~3 min).
  mutants:
    name: Mutation testing (all, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate the trust boundary
        run: cargo mutants --shard ${{ matrix.shard }}/4 --file src/extract.rs --file src/manifest.rs --file src/registry/npm.rs --file src/store.rs --in-place --baseline=skip --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.shard }}.out
          path: mutants.out