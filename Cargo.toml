[package]
name = "blueline"
version = "0.3.1"
edition = "2024"
description = "Release-diff review desk for the package install line. Approve the delta, not the download."
license = "MIT"
repository = "https://github.com/Epoch-AI-Lab/blueline"
keywords = ["security", "supply-chain", "npm", "review", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
# `deflate-flate2`, not the `deflate` meta-feature: `deflate` also enables
# `flate2/zlib-rs`, and Cargo unifies features across the build, so that one
# flag silently switches every flate2 user — blueline's own gunzip in
# `safe_extract` and ureq's HTTP gzip — from miniz_oxide to zlib-rs.
# `deflate-flate2` picks no backend; flate2's own default (`rust_backend`)
# still supplies miniz_oxide, keeping the production decompression path
# byte-identical to what shipped before the zip 9 bump.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rusqlite_migration = "1.3.1"
semver = "1"
thiserror = "2"
similar = { version = "2", features = ["inline"] }
walkdir = "2"
comfy-table = "7"
tempfile = "3"
dirs = "6"
toml = "0.8"

# Landlock is a Linux LSM. The crate carries no `cfg(target_os)` of its own and
# calls `libc::prctl` and `libc::SYS_landlock_*`, which `libc` defines only under
# `linux_like`, so an untargeted dependency breaks the Darwin and Windows jobs in
# release.yml. Target-gated for that reason alone.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[profile.release]
strip = true
lto = true

# The dev profile is where the time goes. Cargo's default is `opt-level = 0`
# with `debug = 2`, and at this crate's size that is what produces a 100 MB test
# binary, a linker peak in the gigabytes, and a `target/debug` measured in
# gigabytes across a hundred stale incremental session caches. Line tables keep
# a failing test pointing at the right source line, which is all a panic needs,
# and they cost a fraction of the full DWARF.
[profile.dev]
debug = "line-tables-only"

# `cargo test` builds its own profile, and it inherits nothing from `[profile.dev]`
# unless it is stated here, so both halves have to be set.
[profile.test]
debug = "line-tables-only"

# Dependencies are only ever linked in. Nobody steps through `serde_json`, so
# emitting debug info for it only makes the linker read more than it has to.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
