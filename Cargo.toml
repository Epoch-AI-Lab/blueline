[package]
name = "blueline"
version = "0.2.0"
edition = "2024"
description = "Release-diff review desk for the package install line. Approve the delta, not the download."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rusqlite_migration = "1.3.1"
semver = "1"
thiserror = "2"
similar = { version = "2", features = ["inline"] }
walkdir = "2"
comfy-table = "7"
tempfile = "3"
dirs = "6"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[profile.release]
strip = true
lto = true
