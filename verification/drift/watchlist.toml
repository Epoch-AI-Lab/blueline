# The drift watchlist: pinned real-world packages the nightly job reviews so
# a heuristic change that moves a real verdict surfaces as a diff, not a
# surprise. Chosen for diversity (network-heavy, native/binary, scopes,
# historical compromise subjects, cargo core) and stability — versions are
# pinned so the only variable between runs is the tool itself.
#
# Keep entries well-known and long-lived. An unpublished or renamed package
# turns the whole nightly red for noise.

